<!-- Assunto: Crie uma senha nova para a sua conta DigitalJew -->
<!-- Supabase: Authentication -> Emails -> Reset password -->
<!-- O link usa token_hash para funcionar em qualquer aparelho (não só no navegador que pediu). -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#182838">
  <h2 style="margin:0 0 12px">Crie uma senha nova</h2>
  <p style="margin:0 0 20px;line-height:1.6">Recebemos um pedido para criar uma senha nova para a sua conta na DigitalJew. Clique no botão abaixo:</p>
  <p style="margin:0 0 20px"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:14px 24px;background:#58c0d0;color:#102637;font-weight:bold;text-decoration:none;border-radius:4px">Criar senha nova</a></p>
  <p style="margin:0 0 8px;line-height:1.6">O link vale por 1 hora e só pode ser usado uma vez.</p>
  <p style="margin:0;line-height:1.6;color:#5b6b78;font-size:13px">Se não foi você quem pediu, é só ignorar este e-mail: sua senha continua a mesma.</p>
  <p style="margin:24px 0 0;color:#5b6b78;font-size:12px">DigitalJew Software</p>
</div>
